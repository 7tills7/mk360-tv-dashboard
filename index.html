<!DOCTYPE html>
<html>

<head>

<title>MK360 Pick Performance</title>

<style>

body{
    margin:0;
    background:#081224;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.header{
    text-align:center;
    padding:20px;
    border-bottom:3px solid #1d4ed8;
}

.header h1{
    margin:0;
    font-size:64px;
}

.header p{
    color:#b3b3b3;
    font-size:28px;
}

.dashboard{
    padding:15px;
}

.row{
    display:flex;
    gap:15px;
    margin-bottom:15px;
}

.card{
    flex:1;
    background:#172a46;
    border-radius:20px;
    text-align:center;
    padding:20px;
}

.summary{
    border:2px solid #1d4ed8;
    background:#081f46;
}

.title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;
}

.value{
    font-size:72px;
    font-weight:bold;
    color:#4287ff;
}

.small{
    font-size:28px;
    color:#c4c4c4;
}

.footer{
    text-align:center;
    padding:10px;
    color:#c4c4c4;
    font-size:22px;
}

</style>

</head>

<body>

<div class="header">

    <h1>MK360 PICK PERFORMANCE</h1>

    <p id="todayDate"></p>

</div>

<div class="dashboard">

    <div class="row">

        <div class="card">
            <div class="title">XDO</div>
            <div class="value" id="XDO_CPH"></div>
            <div class="small">CPH</div>
        </div>

        <div class="card">
            <div class="title">STR</div>
            <div class="value" id="STR_CPH"></div>
            <div class="small">CPH</div>
        </div>

        <div class="card">
            <div class="title">RDC</div>
            <div class="value" id="RDC_CPH"></div>
            <div class="small">CPH</div>
        </div>

        <div class="card">
            <div class="title">WRAP</div>
            <div class="value" id="Wrap_Cage_CPH"></div>
            <div class="small">CPH</div>
        </div>

    </div>

    <div class="row">

        <div class="card summary">
            <div class="title">TOTAL VOLUME</div>
            <div class="value" id="Total_Volume"></div>
        </div>

        <div class="card summary">
            <div class="title">TOTAL HOURS</div>
            <div class="value" id="Total_Hours"></div>
        </div>

        <div class="card summary">
            <div class="title">SITE CPH</div>
            <div class="value" id="Site_CPH"></div>
        </div>

    </div>

    <div class="row">

        <div class="card">
            <div class="title">XDO VOLUME</div>
            <div class="value" id="XDO_Volume"></div>
        </div>

        <div class="card">
            <div class="title">STR VOLUME</div>
            <div class="value" id="STR_Volume"></div>
        </div>

        <div class="card">
            <div class="title">RDC VOLUME</div>
            <div class="value" id="RDC_Volume"></div>
        </div>

        <div class="card">
            <div class="title">WRAP VOLUME</div>
            <div class="value" id="Wrap_Cage_Volume"></div>
        </div>

    </div>

</div>

<div class="footer">
    Last Updated: <span id="LastUpdated"></span>
</div>

<script src="dashboard-data.js"></script>

<script>

for (const key in dashboardData) {

    const element = document.getElementById(key);

    if(element){

        let value = dashboardData[key];

        if(typeof value === "number"){

            value = value.toLocaleString(undefined,{
                maximumFractionDigits:1
            });

        }

        element.innerText = value;

    }

}

document.getElementById("LastUpdated").innerText =
dashboardData.LastUpdated;

document.getElementById("todayDate").innerText =
new Date().toLocaleDateString(
'en-GB',
{
weekday:'long',
day:'numeric',
month:'long',
year:'numeric'
});

</script>

<script>

setTimeout(function() {
    location.reload();
}, 60000);

</script>

</body>

</html>
