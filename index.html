<!DOCTYPE html>
<html>

<head>
    <title>MK360 Dashboard</title>

    <style>

        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            margin:0;
            padding:30px;
        }

        h1{
            text-align:center;
            font-size:60px;
            margin-bottom:50px;
        }

        .container{
            display:flex;
            justify-content:center;
            gap:30px;
            flex-wrap:wrap;
        }

        .card{
            width:300px;
            background:#1e293b;
            border-radius:15px;
            padding:30px;
            text-align:center;
        }

        .value{
            font-size:80px;
            font-weight:bold;
            color:#3b82f6;
        }

        .label{
            font-size:28px;
            margin-top:10px;
        }

    </style>

</head>

<body>

<h1>MK360 LIVE DASHBOARD</h1>

<div class="container">

    <div class="card">
        <div class="value">128</div>
        <div class="label">Headcount</div>
    </div>

    <div class="card">
        <div class="value">17</div>
        <div class="label">Agency</div>
    </div>

    <div class="card">
        <div class="value">102%</div>
        <div class="label">Productivity</div>
    </div>

</div>

</body>

</html>
